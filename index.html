    <div class="popup" id="popup">
      <h2> Connection </h2> <br> <br>
        <form id="SignupForm">
          <label for="username"> Nom: </label>
          <input type="text" id="username" required> <br> <br>

          <label for="email"> E-mail: </label>
          <input type="text" id="email" required> <br> <br>

          <label for="password"> Mot de passe: </label>
          <input type="password" id="password" required> <br> <br>

          <label for="ConfirmPassword"> Confirmer le mot de passe: </label>
          <input type="password" id="ConfirmPassword" required> <br> <br>

          <button type="submit"> S'inscrire </button> <br> <br>
          <button type="button" onclick="closePopup()"> Fermer </button>
        </form>
    </div>
  </div>


  <script>
  const loginButton = document.getElementById("loginButton");
const popup = document.getElementById("popup");
const signupForm = document.getElementById("SignupForm");

loginButton.addEventListener("click", () => popup.classList.add("open-popup"));
function closePopup() { popup.classList.remove("open-popup"); }

signupForm.addEventListener("submit", function(event) {
    event.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("ConfirmPassword").value;

    if (password !== confirmPassword) {
        alert("Les mots de passe ne correspondent pas !");
        return;
    }

    let users = JSON.parse(localStorage.getItem("users")) || [];
    users.push({ email: email, password: password });
    localStorage.setItem("users", JSON.stringify(users));

    localStorage.setItem("isLoggedIn", "true");
    alert("Inscription et connexion réussies !");
    window.location.reload();
});

if (localStorage.getItem("isLoggedIn") === "true") {
    document.getElementById("menu").style.display = "block";
    loginButton.style.display = "none";
}
const logoutButton = document.getElementById("logoutButton");

function updateUI() {
   const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";

   if (isLoggedIn) {
       loginButton.style.display = "none";
       logoutButton.style.display = "inline-block";
       document.getElementById("menu").style.display = "block"; // Montre le menu
   } else {
       loginButton.style.display = "inline-block";
       logoutButton.style.display = "none";
       document.getElementById("menu").style.display = "none";
   }
}


logoutButton.addEventListener("click", () => {
   localStorage.removeItem("isLoggedIn");
   alert("Vous êtes déconnecté.");
   window.location.reload();
});

updateUI();


  </script>
